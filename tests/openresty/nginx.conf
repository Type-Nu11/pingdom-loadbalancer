worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # Test-only stand-in for the Rust edge container's exact source IP.
    # Never trust the entire Docker subnet or arbitrary client addresses.
    set_real_ip_from 172.30.78.10;
    real_ip_header X-Real-IP;
    real_ip_recursive off;

    server {
        listen 8081;
        location /whoami {
            default_type text/plain;
            return 200 "route=web\nremote_addr=$remote_addr\nrealip_remote_addr=$realip_remote_addr\n";
        }
    }

    server {
        listen 8082;
        location /whoami {
            default_type text/plain;
            return 200 "route=app\nremote_addr=$remote_addr\nrealip_remote_addr=$realip_remote_addr\n";
        }
    }
}
