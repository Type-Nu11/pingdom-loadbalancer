services:
  haproxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pingdom-haproxy
    restart: unless-stopped
    ports:
      - "443:443"
      - "127.0.0.1:8404:8404"
    volumes:
      - haproxy-runtime:/var/run/haproxy
    networks:
      - edge

  rust-agent:
    build:
      context: ./rust-agent
    container_name: pingdom-haproxy-agent
    restart: unless-stopped
    command: ["--socket", "/var/run/haproxy/admin.sock", "--interval", "5"]
    volumes:
      - haproxy-runtime:/var/run/haproxy:ro
    depends_on:
      - haproxy
    networks:
      - edge

volumes:
  haproxy-runtime:

networks:
  edge:
    name: pingdom-edge
