services:
  haproxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pingdom-haproxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8404:8404"
    volumes:
      - haproxy-runtime:/var/run/haproxy
    networks:
      - edge

  rust-agent:
    build:
      context: ./rust-agent
    container_name: pingdom-haproxy-agent
    restart: unless-stopped
    command: ["--socket", "/var/run/haproxy/admin.sock", "--interval", "5"]
    volumes:
      - haproxy-runtime:/var/run/haproxy:ro
    depends_on:
      - haproxy
    networks:
      - edge

volumes:
  haproxy-runtime:

networks:
  edge:
    name: pingdom-edge
      - ./haproxy/acl:/usr/local/etc/haproxy/acl:ro
      - ${TLS_CERTIFICATE_DIR:-./haproxy/certs}:/usr/local/etc/haproxy/certs:ro
      - ./runtime:/var/run/haproxy

    healthcheck:
      test: ["CMD", "haproxy", "-c", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
      interval: 10s
      timeout: 5s
      retries: 3

