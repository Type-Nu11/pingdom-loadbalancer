global
    log stdout format raw local0
    maxconn 50000
    stats socket /var/run/haproxy/admin.sock mode 660 level admin

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client 2m
    timeout server 2m
    timeout client-fin 30s
    timeout tunnel 1h

resolvers docker
    parse-resolv-conf
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

frontend tls_entry
    bind :443

    # One stick table covers all three hostnames on this HAProxy instance.
    stick-table type ip size 1m expire 10m store conn_rate(10s)
    tcp-request connection track-sc0 src
    tcp-request connection reject if { sc_conn_rate(0) gt 100 }

    # Wait for the TLS ClientHello so SNI can select the backend.
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }

    use_backend www_backend if { req.ssl_sni -i www.typenull.xyz }
    use_backend api_backend if { req.ssl_sni -i api.typenull.xyz }
    use_backend origin_backend if { req.ssl_sni -i origin.typenull.xyz }

    default_backend rejected_backend

backend www_backend
    mode tcp
    option tcp-check
    server www_openresty www-openresty:443 check send-proxy-v2 resolvers docker init-addr last,libc,none

backend api_backend
    mode tcp
    option tcp-check
    server api_openresty api-openresty:443 check send-proxy-v2 resolvers docker init-addr last,libc,none

backend origin_backend
    mode tcp
    option tcp-check
    server origin origin-openresty:443 check send-proxy-v2 resolvers docker init-addr last,libc,none

backend rejected_backend
    mode tcp
    tcp-request content reject
    timeout client 60s
    timeout server 60s

    option http-server-close
    option redispatch


#####################################
# HTTPS EDGE
#####################################

frontend https_in

    bind *:443 ssl crt /usr/local/etc/haproxy/certs alpn h2,http/1.1

    #################################
    # Client Rate Limit
    #################################

    stick-table type ip size 1m expire 10m store http_req_rate(10s)

    http-request track-sc0 src

    acl abuse sc_http_req_rate(0) gt 200

    http-request deny deny_status 429 if abuse


    #################################
    # Static Block IP
    #################################

    acl blocked_ip src -f /usr/local/etc/haproxy/acl/blocked_ip.lst

    http-request deny deny_status 403 if blocked_ip


    #################################
    # XFF
    #################################
    option forwardfor
    http-request set-header X-Forwarded-Proto https


    #################################
    # Per-Path Timeout Override
    #################################

    acl long_running_api path_beg /users/me/merchant-place-applications

    http-request set-timeout client 180s if long_running_api


    #################################
    # Forward
    #################################

    default_backend spring_cluster



#####################################
# HTTP Redirect
#####################################

frontend http_in

    bind *:80

    http-request redirect scheme https code 308



#####################################
# OpenResty Gateway Pool
#####################################

# backend openresty_cluster

#     balance roundrobin

#     #################################
#     # Health Check
#     #################################

#     option httpchk GET /health

#     http-check expect status 200


#     #################################
#     # OpenResty Nodes
#     #################################

#     server openresty_1 10.0.2.10:8080 check inter 5s rise 2 fall 3

#     server openresty_2 10.0.2.11:8080 check inter 5s rise 2 fall 3

backend spring_cluster

    balance roundrobin

    #################################
    # Per-Path Timeout Override
    #################################

    acl long_running_api path_beg /users/me/merchant-place-applications

    http-request set-timeout server 180s if long_running_api


    #################################
    # Health Check
    #################################

    option httpchk GET /

    http-check expect status 200


    #################################
    # Spring Nodes
    #################################

    server spring_1 54.116.166.107:8080 check inter 5s rise 2 fall 3



#####################################
# HAProxy Statistics
#####################################

listen stats
    bind 127.0.0.1:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    stats auth admin:password
