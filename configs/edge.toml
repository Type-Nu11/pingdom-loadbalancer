[proxy]
name = "typenull-edge"
worker_threads = 0

[tls]
listen = "0.0.0.0:443"
hostname = "www.typenull.xyz"
# The container mounts Ubuntu's existing /etc/letsencrypt read-only.
certificate = "/etc/letsencrypt/live/www.typenull.xyz/fullchain.pem"
private_key = "/etc/letsencrypt/live/www.typenull.xyz/privkey.pem"

[upstreams]
# The container uses host networking on Ubuntu, so loopback reaches OpenResty.
web = "127.0.0.1:8081"
app = "127.0.0.1:8082"

[routing]
target_header = "X-Client-Type"

[rate_limit]
enabled = true
max_requests = 1200
window_seconds = 10
strike_window_seconds = 60
strikes_before_block = 3
block_seconds = 10
max_tracked_ips = 50000
