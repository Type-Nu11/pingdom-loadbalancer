[package]
name = "proxy-server"
version = "0.1.0"
edition = "2021"

[dependencies]
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "http2", "client", "server"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "server-auto", "tokio"] }
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
proxy-config = { path = "../proxy-config" }
proxy-ratelimit = { path = "../proxy-ratelimit" }

[dev-dependencies]
rcgen = "0.14"
tempfile = "3"
